name: exp1_local_baselines
status: ready
model: jev-1.13.0
task: chaosnli
serving_path: native
pricing_snapshot_date: '2026-09-19'
geography_note: 'Fill in before scored paper runs (city / region / cloud). TypeSafe
  published latency numbers come from US West Coast laptops.

  '
concurrency: 1
repeats: 1
description: "LOCAL ARMS ONLY \u2014 sealed overnight run on the ChaosNLI analysis\
  \ set (same 750/750 items as EXP-1). No Jev. No paid APIs. Outputs are written to\
  \ runs/ and must not be opened for analysis until the analysis stage. BART-MNLI\
  \ is supervised_in_domain_reference (report MNLI vs SNLI separately)."
questions:
  relation:
    kind: choice
    instructions: 'Decide whether the hypothesis is entailed by the premise, contradicted
      by the premise, or neither (neutral). Use only the premise and the hypothesis
      in the state. Do not use any outside knowledge of the dataset this pair came
      from.

      '
    criteria:
      entailment: The hypothesis must be true if the premise is true.
      neutral: The hypothesis might be true, but the premise does not require it.
      contradiction: The hypothesis cannot be true if the premise is true.
  noul_entailment:
    kind: noul
    instructions: 'The hypothesis is entailed by the premise (must be true if the
      premise is true). Use only the premise and hypothesis in the state.

      '
    criteria:
      'true': The hypothesis must be true if the premise is true.
      'false': The hypothesis is not entailed by the premise.
  noul_neutral:
    kind: noul
    instructions: 'The hypothesis is neutral with respect to the premise (might be
      true, but the premise does not require it). Use only the premise and hypothesis
      in the state.

      '
    criteria:
      'true': The premise neither entails nor contradicts the hypothesis.
      'false': The hypothesis is entailed or contradicted by the premise.
  noul_contradiction:
    kind: noul
    instructions: 'The hypothesis is contradicted by the premise (cannot be true if
      the premise is true). Use only the premise and hypothesis in the state.

      '
    criteria:
      'true': The hypothesis cannot be true if the premise is true.
      'false': The hypothesis is not contradicted by the premise.
clients:
- name: prefill_qwen15
  type: prefill
  model: Qwen/Qwen2.5-1.5B-Instruct
  prefill_backend: transformers
  repeats: 1
- name: gliclass
  type: gliclass
  model: knowledgator/gliclass-base-v1.0
  repeats: 1
- name: bart_mnli_ref
  type: bart_mnli
  model: facebook/bart-large-mnli
  role: supervised_in_domain_reference
  repeats: 1
- name: trivial
  type: trivial
  repeats: 1
hypotheses:
- id: H1
  statement: "Top-label \u0394ECE = ECE(high-entropy) \u2212 ECE(low-entropy) differs\
    \ from zero (hard less calibrated), under soft scoring, with equal n=750 per stratum.\
    \ Soft correctness is the share of the 100 annotators who chose the model's argmax.\
    \ Bin accuracy is the mean of that share.\n"
  falsified_when: "The stratified two-sample bootstrap 95% CI on soft \u0394ECE (percentile\
    \ and BCa, n_boot=10000) includes zero \u2014 inconclusive, not equivalence \u2014\
    \ or the study ran underpowered relative to the asymmetric-noise power result\
    \ in results/power_asymmetric.json.\n"
- id: H1a
  statement: 'DESCRIPTIVE: ECE is approximately flat across difficulty after accounting
    for bin occupancy.

    '
  falsified_when: 'Descriptive only. Never treat the four-point slope as the powered
    claim.

    '
- id: H1b
  statement: 'DESCRIPTIVE: ECE rises as accuracy falls (calibration tracks accuracy).

    '
  falsified_when: 'Descriptive only. Interval crossing zero is inconclusive.

    '
metrics:
- "PRIMARY: soft top-label \u0394ECE (high-entropy vs low-entropy), equal n=750, bias-corrected\
  \ parametric test (Amendment 9); BCa + percentile reported beside it"
- "PRIMARY ARMS: Choice and normalized three-Noul from the same call \u2014 report\
  \ both"
- "VERDICT: tracks = corrected\u22650.09 AND p<0.05; holds = reject \u0394\u22650.09\
  \ (sim under 0.09) AND corrected\u22640.02; else inconclusive"
- "REPORTED: hard top-label \u0394ECE (argmax vs majority). Hard scoring puts label\
  \ noise in the hard stratum only, which inflates \u0394ECE in the direction of the\
  \ hypothesis."
- "SECONDARY S1 (exploratory): ambiguity detection \u2014 AUROC/Spearman of (1\u2212\
  top), Choice\u2194Noul JSD, repeat instability vs human entropy; paired bootstrap\
  \ between signals"
- 'SECONDARY S2 (exploratory): flip rate vs human entropy (stability reconciliation)'
- 'SECONDARY S3 (exploratory): one-temperature scaling, stratified half/half, Choice
  and Noul separately'
- 'SECONDARY: JSD and TVD to human distribution per stratum, both arms, vs uniform-guess
  baseline'
- "ECE (uniform + quantile) with per-bin occupancy \u2014 M in {5,10,15,20} robustness"
- Per-tier reliability diagrams with occupancy
- 'DESCRIPTIVE ONLY: ECE-vs-accuracy slope where four tiers exist'
- "Same primary analysis on local prefill + GLiClass (equal items); frontier LLM comparison\
  \ out of scope \u2014 cite jev-frontier-bench"
- "REFERENCE (not a baseline): BART-large-MNLI supervised in-domain \u2014 report\
  \ MNLI vs SNLI separately; never in the same table as Jev"
- "Local arms run once (repeats=1); determinism check: 50 items \xD7 3 repeats"
- 'Contamination: original vs frozen paraphrase accuracy, every arm'
- Accuracy / Brier / MCE per stratum
- Latency p50/p95/p99 (never mean); local baselines flagged unfair vs hosted
- 'SEALED: do not open raw.jsonl for analysis until analysis stage'
decision_rules:
- "Primary verdict is Amendment 9 on corrected soft \u0394ECE; certificate uses harness\
  \ result.verdict."
- Report Choice and Noul arms; neither is 'the' result.
- "Always report raw and corrected \u0394ECE; always report hard beside soft."
- Never report ECE without bin occupancy.
- "Calibration metrics use probabilities only \u2014 never confidence."
- "If the M\u2208{5,10,15,20} sweep flips the raw-interval sign, say so; parametric\
  \ corrected test remains primary."
- Do not score underpowered relative to results/power_asymmetric.json / soft_bias_correction.json.
- 'The hand-labelling kappa gate does not apply: agreement is the 100-annotator distribution.'
- A large drop from original wording to the frozen paraphrase, on every arm, is a
  memorisation signal, not a calibration finding.
sample_size:
  min_items: 1500
  n_per_stratum: 750
  per_tier: null
  repeats: 1
  notes: "Entropy quartiles on the 3,113 SNLI+MNLI items, then subsample_to_equal_n\
    \ to 750 per stratum (seed 20260923). Thresholds are in datasets/chaosnli/thresholds.json\
    \ and were fixed before any Jev call. \u03B1NLI is excluded. R=10 repeats feed\
    \ S1/S2 instability signals (Amendment 10) and EXP-6. Budget: hard cap $1.00 for\
    \ EXP-1; global spendable $2.50 (50% of $5 reserve untouched).\n"
stopping_rule: "Stop after the pre-registered powered sample is scored with the stated\
  \ repeats. Do not add items because interim \u0394ECE looks flat or rising. Do not\
  \ move the entropy thresholds after seeing model output.\n"
rate_limit:
  headroom: 0.8
strata:
  hard:
  - hard
  easy:
  - easy
label_agreement:
  fraction: 0.0
  kappa_floor: null
  note: 'Replaced by the ChaosNLI 100-annotator distribution. Entropy is the agreement
    measure. No second pass and no kappa gate.

    '
