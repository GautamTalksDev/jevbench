[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jevbench"
version = "0.1.0"
description = "Pre-registered, difficulty-stratified calibration study of TypeSafe Jev"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "jevbench contributors" }]
dependencies = [
    "typesafe-sdk>=0.7.2",
    "system-one-adapter>=0.2.1",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "scipy>=1.17.1",
    "scikit-learn>=1.9.1",
    "pandas>=3.0.6",
    "matplotlib>=3.11.2",
    "pydantic>=2.13.5",
    "typer>=0.27.2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "netcal>=1.4.0",
    "mapie>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "playwright>=1.63.0",
]
openai = [
    "system-one-adapter[openai]",
]
anthropic = [
    "system-one-adapter[anthropic]",
]

[project.scripts]
jevbench = "jevbench.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["jevbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
